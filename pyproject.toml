[project]
name = "url-shortener"
version = "0.1.0"
description = "Микросервис для сокращения ссылок"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn>=0.34.2",
    "sqlalchemy>=2.0.40",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
